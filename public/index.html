  <noscript>You need to enable JavaScript to run this app.</noscript>
  <script type="text/javascript">
    window.app = {
      appname: "dealerReports",
      lambda: "https://mfsc1295bd.execute-api.us-east-1.amazonaws.com/latest",
      country: "https://w5gkasqpv3.execute-api.us-east-1.amazonaws.com/latest"

    }




    async function appendStylesheet(href) {
      let cssLink = document.createElement('link');
      cssLink.rel = 'stylesheet';
      cssLink.media = 'all';
      cssLink.href = href;
      // console.log('cssLink', cssLink)
      document.head.appendChild(cssLink);
    }

    async function loadCSSResources(pathPrefix, cssResources) {
      for (const cssResourceName of cssResources) {
        appendStylesheet(pathPrefix + 'css/' + cssResourceName)
          .catch(error => loadError(error));
      }
      // appendStylesheet(pathPrefix + 'font-awesome/css/font-awesome.css')
      //   .catch(error => loadError(error));
    }

    async function clarityScreenRecording(c, l, a, r, i, t, y) {

      c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
      t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
      y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
    };


    async function prefixScript(url, onloadFunction) {
      let newScript = document.createElement("script");
      newScript.src = url;
      newScript.async = true;
      newScript.onerror = loadError;
      if (onloadFunction) { newScript.onload = onloadFunction; }

      let currentScript = (document.currentScript && document.currentScript.parentNode) ?
        document.currentScript :
        document.getElementsByTagName('script')[0];

      let parentNode = currentScript.parentNode;
      parentNode.insertBefore(newScript, currentScript);
    }

    async function affixScriptToHead(url, id, onloadFunction) {
      let script = document.createElement("script");
      if (onloadFunction) { script.onload = onloadFunction; }
      document.head.appendChild(script);
      script.src = url;
      script.id = id;
    }

    async function loadJSResources(type, pathPrefix, jsResources) {
      for (const jsResourceName of jsResources) {
        if (type == 'cdn') {
          affixScriptToHead(jsResourceName, "", function (data) {
          }).catch(error => loadError(error));
        }
        if (type == 'js') {
          affixScriptToHead(pathPrefix + 'js/' + jsResourceName, "", function (data) {
          }).catch(error => loadError(error));
        }
      }

    }

    function loadError(oError) {
      throw new URIError("The script " + oError.target.src + " didn't load correctly.");
    }

    function processSiteSettings(siteSettingsIn) {
      if (!siteSettingsIn) {
        console.error('Error loading site settings.');
        return;
      }
      if (siteSettingsIn.appname) {
        appname = siteSettingsIn.appname;
      } else {
        console.warn('No appName set in configuration.');
      }
      if (!window.app.appname) {
        console.error('appName not set.');
        return;
      }
      let siteSettings = Object.assign({}, siteSettingsIn);
      window.site = siteSettings;
      Title = siteSettings.siteTitle;
      console.log("site",siteSettings)
      let imageCloudfront = siteSettings && siteSettings.common && siteSettings.common.imageCloudfront
      clarityScreenRecording(window, document, "clarity", "script", siteSettings.admin.clarity)
      let imagesAssetResourcesPrefix = siteSettings && siteSettings.common && siteSettings.common.resourcesUrl + window.app.appname + "/" + "admin/theme/";
      document.title = Title;
      $("#favicon").attr("href", imagesAssetResourcesPrefix + "/images/favicon.png");
      let cssResources = (((((siteSettings || {}).admin || {}).resources || {}).css || {}) || []);
      console.log("cssResources", cssResources);
      loadCSSResources(imagesAssetResourcesPrefix, cssResources);

      let jsResources = (((((siteSettings || {}).admin || {}).resources || {}).js || {}) || []);
      console.log("jsResources", jsResources);
      loadJSResources('js', imagesAssetResourcesPrefix, jsResources);
      
    }



    function websiteDefaults() {
      fetch(window.app.lambda + "/config?" + (window.app.appname ? 'appname=' + window.app.appname : 'location=' + windowLocation.href))
        .then(res => res.json())
        // .then(data => processSiteSettings(data.result[0]))
        .then(data => {
          processSiteSettings(data.result)
        })
        .catch(error => console.error('Error loading site settings: ', error));
    }
    websiteDefaults();
  </script>
